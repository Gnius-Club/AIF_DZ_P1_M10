<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>La Red de los Corazones Conectados</title>
    <style>
        :root {
            --bg-deep: #0b0e2e;
            --neon-blue: #00f3ff;
            --neon-pink: #ff00cc;
            --neon-green: #39ff14;
            --neon-yellow: #fff01f;
            --overlay-bg: rgba(11, 14, 46, 0.98);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: var(--bg-deep);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; user-select: none;
        }

        #stars-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 100px 150px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 200px 300px, #ddd, rgba(0,0,0,0));
            background-size: 300px 300px; z-index: 0;
        }

        /* --- CAPAS --- */
        #game-stage { position: relative; width: 100%; height: 100%; z-index: 1; }
        #svg-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
        #planets-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; }

        /* --- CONTROLES SUPERIORES --- */
        #top-controls {
            position: absolute; top: 15px; right: 15px; left: 15px;
            display: flex; justify-content: space-between; z-index: 1000;
            pointer-events: none;
        }
        .ctrl-btn { pointer-events: auto; }

        .icon-btn {
            background: rgba(0, 243, 255, 0.2); border: 2px solid var(--neon-blue);
            color: white; width: 45px; height: 45px; border-radius: 50%;
            cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center;
        }

        .text-btn-small {
            background: rgba(255, 0, 204, 0.2); border: 2px solid var(--neon-pink);
            color: white; padding: 5px 15px; border-radius: 20px;
            cursor: pointer; font-weight: bold; font-size: 0.8rem;
        }

        /* --- PLANETAS (Ubicados en zona segura) --- */
        .planet {
            position: absolute; width: 85px; height: 85px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 40px; cursor: pointer; z-index: 10;
            border: 3px solid rgba(255,255,255,0.9);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: transform 0.2s;
        }
        .planet:active { transform: translate(-50%, -50%) scale(1.1); }

        .thought-bubble {
            position: absolute; bottom: 105%; background: white;
            border-radius: 12px; padding: 4px; min-width: 35px;
            text-align: center; border: 2px solid var(--neon-blue);
            font-size: 20px; animation: float 3s ease-in-out infinite;
        }

        /* --- INTERFAZ DE DIÁLOGO (No bloqueante) --- */
        #ui-overlay {
            position: absolute; bottom: 15px; left: 0; width: 100%;
            display: flex; justify-content: center; align-items: flex-end;
            gap: 15px; z-index: 100; pointer-events: none; /* Importante para no tapar clics */
        }

        #robot-guide {
            width: 90px; height: 90px; background: #eee;
            border-radius: 25%; border: 4px solid var(--neon-blue);
            display: flex; justify-content: center; align-items: center;
            font-size: 45px; box-shadow: 0 0 15px var(--neon-blue);
            flex-shrink: 0; pointer-events: auto;
        }

        .dialog-box {
            background: white; border-radius: 15px; padding: 15px;
            border: 4px solid var(--neon-blue); width: 65%; max-width: 500px;
            pointer-events: auto; box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }

        .btn-next {
            background: var(--neon-green); border: none; padding: 10px 20px;
            border-radius: 8px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 0 #2a8f0e; font-size: 0.9rem;
        }

        /* --- MODALES --- */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--overlay-bg); z-index: 2000;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; color: white; text-align: center; padding: 20px;
        }

        .title-card { font-size: 2.5rem; color: var(--neon-yellow); margin-bottom: 20px; text-shadow: 0 0 10px rgba(255,255,0,0.5); }
        
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .talking { animation: shake 0.3s infinite; }
        @keyframes shake { 0% { transform: rotate(-2deg); } 100% { transform: rotate(2deg); } }

        .connection-line {
            stroke: var(--neon-yellow); stroke-width: 8; stroke-linecap: round;
            filter: drop-shadow(0 0 5px var(--neon-yellow));
        }
        .hidden { display: none !important; }

    </style>
</head>
<body>

    <div id="stars-container"></div>

    <div id="top-controls" class="hidden">
        <button id="voice-toggle" class="icon-btn ctrl-btn" onclick="toggleVoice()">🔊</button>
        <button id="skip-intro" class="text-btn-small ctrl-btn" onclick="skipIntro()">SALTAR INTRO ⏭️</button>
    </div>

    <div id="start-screen" class="modal">
        <div class="title-card">LA RED DE LOS<br>CORAZONES CONECTADOS</div>
        <p style="font-size: 1.1rem; max-width: 400px; line-height: 1.5;">Aprende a usar el poder de Internet para unir a las personas.</p>
        <button class="btn-next" style="font-size: 1.3rem; margin-top:20px;" onclick="initGame()">¡COMENZAR! 🚀</button>
    </div>

    <div id="game-stage">
        <svg id="svg-canvas"></svg>
        <div id="planets-container"></div>
    </div>

    <div id="ui-overlay" class="hidden">
        <div id="robot-guide">🤖</div>
        <div class="dialog-box">
            <div id="dialog-content" style="font-size: 1rem; font-weight: bold; color: #333; margin-bottom: 10px;">...</div>
            <button id="next-btn" class="btn-next" style="float:right;">Siguiente ▶️</button>
        </div>
    </div>

    <div id="victory-screen" class="modal hidden">
        <div style="font-size: 4rem;">⭐</div>
        <div class="title-card">¡FANTÁSTICO!</div>
        <p id="victory-text" style="font-size: 1.2rem; max-width: 500px; margin-bottom: 30px;"></p>
        <button class="btn-next" style="font-size: 1.3rem; background: var(--neon-blue); box-shadow: 0 4px 0 #008eb3;" onclick="resetGame()">JUGAR DE NUEVO 🔄</button>
    </div>

    <script>
        // COORDENADAS RE-CALIBRADAS PARA EVITAR ÁREA DE UI (y: 15% - 65%)
        const GAME_DATA = {
            intro: [
                { text: "¡Hola! Soy Robo. ¿Ves estos planetas? Sus habitantes están separados por el espacio." },
                { text: "Internet es una RED que nos une a todos, sin importar lo lejos que estemos." },
                { text: "Al conectarnos, podemos compartir mensajes, juegos y muchas ideas geniales." },
                { text: "¡Ayúdame a tejer los hilos mágicos de Internet!" }
            ],
            levels: [
                {
                    narrative: ["Anita extraña a su abuela. 👵", "¡Trazamos un hilo de luz entre ellas!"],
                    phrase: "¡La red acorta la distancia, y nos une en la misma estancia!",
                    planets: [
                        { id: 'anita', emoji: '👧', target: 'abuela', x: 25, y: 40, color: '#ff9a9e' },
                        { id: 'abuela', emoji: '👵', target: 'anita', x: 75, y: 40, color: '#fad0c4' }
                    ],
                    required: 1
                },
                {
                    narrative: ["Paco y Lola quieren jugar carreras. 🏎️", "¡Conéctalos para que empiece la diversión!"],
                    phrase: "¡Con un simple clic, la diversión hace un tic!",
                    planets: [
                        { id: 'paco', emoji: '🏎️', target: 'lola', x: 25, y: 25, color: '#a1c4fd' },
                        { id: 'lola', emoji: '🎮', target: 'paco', x: 75, y: 55, color: '#c2e9fb' }
                    ],
                    required: 1
                },
                {
                    narrative: ["¡Clase de Dinosaurios! 🦖", "Une a todos los niños con el Profesor."],
                    phrase: "¡Compartir una idea, hace que el mundo sea una gran aldea!",
                    planets: [
                        { id: 'profe', emoji: '👨‍🏫', isHub: true, x: 50, y: 20, color: '#84fab0' },
                        { id: 'n1', emoji: '👦', target: 'profe', x: 20, y: 55, color: '#fff' },
                        { id: 'n2', emoji: '👧', target: 'profe', x: 50, y: 60, color: '#fff' },
                        { id: 'n3', emoji: '👶', target: 'profe', x: 80, y: 55, color: '#fff' }
                    ],
                    required: 3
                },
                {
                    narrative: ["¡Fiesta de Leo! 🦁", "Lleva la música, el pastel y los globos hacia él."],
                    phrase: "¡Internet es comunidad, donde florece la verdadera amistad!",
                    planets: [
                        { id: 'leo', emoji: '🦁', isHub: true, x: 50, y: 45, color: '#fccb90' },
                        { id: 'm1', emoji: '🎸', target: 'leo', x: 20, y: 20, color: '#fff' },
                        { id: 'm2', emoji: '🎂', target: 'leo', x: 80, y: 20, color: '#fff' },
                        { id: 'm3', emoji: '🎈', target: 'leo', x: 50, y: 70, color: '#fff' }
                    ],
                    required: 3
                }
            ]
        };

        let currentLevelIdx = 0;
        let dialogueIdx = 0;
        let isVoiceEnabled = true;
        let activeConnections = 0;
        let isDrawing = false;
        let startPlanetEl = null;
        let tempLine = null;
        const synth = window.speechSynthesis;

        function initGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('ui-overlay').classList.remove('hidden');
            document.getElementById('top-controls').classList.remove('hidden');
            runIntro();
        }

        function runIntro() {
            if (dialogueIdx < GAME_DATA.intro.length) {
                updateDialog(GAME_DATA.intro[dialogueIdx].text);
                document.getElementById('next-btn').onclick = () => {
                    dialogueIdx++;
                    runIntro();
                };
            } else {
                startLevel(0);
            }
        }

        function skipIntro() {
            synth.cancel();
            document.getElementById('skip-intro').classList.add('hidden');
            startLevel(0);
        }

        function startLevel(idx) {
            currentLevelIdx = idx;
            activeConnections = 0;
            const level = GAME_DATA.levels[idx];
            
            document.getElementById('planets-container').innerHTML = '';
            document.getElementById('svg-canvas').innerHTML = '';
            document.getElementById('skip-intro').classList.add('hidden');

            level.planets.forEach(p => {
                const el = document.createElement('div');
                el.className = 'planet';
                el.id = p.id;
                el.style.left = p.x + '%';
                el.style.top = p.y + '%';
                el.style.background = `radial-gradient(circle at 30% 30%, white, ${p.color})`;
                el.innerHTML = p.emoji;
                
                const bubble = document.createElement('div');
                bubble.className = 'thought-bubble';
                bubble.innerHTML = p.isHub ? '📢' : '❓';
                el.appendChild(bubble);

                el.addEventListener('mousedown', dragStart);
                el.addEventListener('touchstart', dragStart, {passive: false});
                document.getElementById('planets-container').appendChild(el);
            });

            dialogueIdx = 0;
            runLevelNarrative();
        }

        function runLevelNarrative() {
            const level = GAME_DATA.levels[currentLevelIdx];
            if (dialogueIdx < level.narrative.length) {
                updateDialog(level.narrative[dialogueIdx]);
                document.getElementById('next-btn').classList.remove('hidden');
                document.getElementById('next-btn').onclick = () => {
                    dialogueIdx++;
                    runLevelNarrative();
                };
            } else {
                updateDialog("¡Teje la red con tu dedo!");
                document.getElementById('next-btn').classList.add('hidden');
            }
        }

        function updateDialog(text) {
            document.getElementById('dialog-content').textContent = text;
            if (isVoiceEnabled) {
                synth.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'es-ES';
                utter.onstart = () => document.getElementById('robot-guide').classList.add('talking');
                utter.onend = () => document.getElementById('robot-guide').classList.remove('talking');
                synth.speak(utter);
            }
        }

        function toggleVoice() {
            isVoiceEnabled = !isVoiceEnabled;
            document.getElementById('voice-toggle').textContent = isVoiceEnabled ? '🔊' : '🔇';
            if (!isVoiceEnabled) synth.cancel();
        }

        function dragStart(e) {
            const touch = e.touches ? e.touches[0] : e;
            const planet = e.target.closest('.planet');
            if (!planet) return;

            startPlanetEl = planet;
            isDrawing = true;

            tempLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
            tempLine.setAttribute("class", "connection-line");
            const pos = getCenter(planet);
            tempLine.setAttribute("x1", pos.x);
            tempLine.setAttribute("y1", pos.y);
            tempLine.setAttribute("x2", pos.x);
            tempLine.setAttribute("y2", pos.y);
            document.getElementById('svg-canvas').appendChild(tempLine);

            window.addEventListener('mousemove', dragMove);
            window.addEventListener('touchmove', dragMove, {passive: false});
            window.addEventListener('mouseup', dragEnd);
            window.addEventListener('touchend', dragEnd);
        }

        function dragMove(e) {
            if (!isDrawing) return;
            const touch = e.touches ? e.touches[0] : e;
            tempLine.setAttribute("x2", touch.clientX);
            tempLine.setAttribute("y2", touch.clientY);
        }

        function dragEnd(e) {
            window.removeEventListener('mousemove', dragMove);
            window.removeEventListener('touchmove', dragMove);
            
            const touch = e.changedTouches ? e.changedTouches[0] : e;
            const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
            const endPlanetEl = targetEl ? targetEl.closest('.planet') : null;

            if (endPlanetEl && endPlanetEl !== startPlanetEl) {
                validate(startPlanetEl, endPlanetEl);
            } else if (tempLine) {
                tempLine.remove();
            }
            isDrawing = false;
        }

        function validate(p1, p2) {
            const level = GAME_DATA.levels[currentLevelIdx];
            const d1 = level.planets.find(p => p.id === p1.id);
            const d2 = level.planets.find(p => p.id === p2.id);

            if (d1.target === d2.id || d2.target === d1.id) {
                activeConnections++;
                const pos2 = getCenter(p2);
                tempLine.setAttribute("x2", pos2.x);
                tempLine.setAttribute("y2", pos2.y);
                tempLine.style.stroke = "var(--neon-blue)";
                p1.querySelector('.thought-bubble').innerHTML = '❤️';
                p2.querySelector('.thought-bubble').innerHTML = '❤️';
                
                if (activeConnections >= level.required) {
                    setTimeout(() => {
                        updateDialog(level.phrase);
                        document.getElementById('next-btn').classList.remove('hidden');
                        document.getElementById('next-btn').textContent = "Próxima Misión ▶️";
                        document.getElementById('next-btn').onclick = () => {
                            if (currentLevelIdx + 1 < GAME_DATA.levels.length) startLevel(currentLevelIdx + 1);
                            else showVictory();
                        };
                    }, 500);
                }
            } else {
                tempLine.remove();
            }
        }

        function getCenter(el) {
            const r = el.getBoundingClientRect();
            return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
        }

        function showVictory() {
            document.getElementById('ui-overlay').classList.add('hidden');
            document.getElementById('victory-screen').classList.remove('hidden');
            const txt = "¡Eres un Guardián increíble! Has unido a toda la galaxia y ahora todos pueden compartir y ser felices en comunidad.";
            document.getElementById('victory-text').textContent = txt;
            updateDialog(txt);
        }

        function resetGame() {
            currentLevelIdx = 0;
            dialogueIdx = 0;
            synth.cancel();
            document.getElementById('victory-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            document.getElementById('top-controls').classList.add('hidden');
            document.getElementById('planets-container').innerHTML = '';
            document.getElementById('svg-canvas').innerHTML = '';
        }
    </script>
</body>
</html>
